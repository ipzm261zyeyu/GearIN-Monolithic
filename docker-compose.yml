services:
  backend:
    build: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      PORT: 4000

  users:
    build: ./services/users
    env_file:
      - ./Backend/.env
    environment:
      PORT: 4001
      MONGO_DB_NAME: gearin_users

  catalog:
    build: ./services/catalog
    env_file:
      - ./Backend/.env
    environment:
      PORT: 4002
      MONGO_DB_NAME: gearin_catalog

  payments:
    build: ./services/payments
    env_file:
      - ./Backend/.env
    environment:
      PORT: 4003
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-braintree}

  gateway:
    build: ./services/gateway
    env_file:
      - ./Backend/.env
    environment:
      PORT: 8080
      MONOLITH_URL: http://backend:4000
      USERS_URL: http://users:4001
      CATALOG_URL: http://catalog:4002
      PAYMENTS_URL: http://payments:4003
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - users
      - catalog
      - payments

  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - gateway
